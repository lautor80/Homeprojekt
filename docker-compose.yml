# Portalbasis – komplette Installation (App, Datenbank, PDF-Dienst, Backup)
# Start: ./install.sh  bzw.  docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command: ["gotenberg", "--chromium-disable-javascript=true"]

  app:
    build: .
    image: ${COMPOSE_PROJECT_NAME:-portal}-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORTAL_MODULES: ${PORTAL_MODULES:-*}
      GOTENBERG_URL: http://gotenberg:3000
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      TZ: ${TZ:-Europe/Berlin}
    ports:
      - "${PORTAL_PORT:-8080}:8080"

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - ./data/backups:/backups
    entrypoint: ["sh", "/backup.sh", "loop"]

  # Optional: HTTPS mit automatischem Let's-Encrypt-Zertifikat
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN}
    volumes:
      - ./backup/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
