<style>

}

  --positive: #6fcf86; --positive-bg: #17301e; --critical: #ffb45c; --critical-bg: #3a2a12;
  --negative: #ff8f8f; --negative-bg: #3b1a1a; --info: #7cbcff; --info-bg: #142a44;
  --balken: #3987e5; --kritisch: #e9793a; --anteil: rgba(0, 0, 0, 0.42); --schleier: rgba(0, 0, 0, 0.6); color-scheme: dark } }

  --bg: #12171c; --surface: #1d232a; --surface-2: #252d36; --text: #f5f6f7; --label: #a9b4be; --border: #3b4652;
  --brand: #4db1ff; --brand-ink: #0a1620; --shell: #1d232a; --hover: #2a333d;

button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
.knopf { border-radius: 8px; padding: 6px 14px; border: 1px solid var(--brand); background: var(--surface); color: var(--brand); white-space: nowrap; }
.knopf.haupt { background: var(--brand); color: var(--brand-ink); font-weight: 700; }
.knopf.still { border-color: transparent; background: transparent; }
.knopf.still:hover, .ik:hover { background: var(--hover); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; color: var(--label); padding: 10px 14px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--brand); border-bottom-color: var(--brand); font-weight: 700; }
input[type="text"], input[type="number"], input[type="date"], select { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; min-width: 0; }
.karte { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-top: 16px; min-width: 0; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px 24px; }
.kpi .l { color: var(--label); font-size: 12px; } .kpi .w { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; } .kpi small { color: var(--label); display: block; }
.gantt { overflow: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
.gantt svg { display: block; font-family: var(--font); }
.gantt text { fill: var(--text); font-size: 12px; } .gantt text.leise { fill: var(--label); font-size: 11px; }
.gantt .raster { stroke: var(--border); } .gantt .kopfband { fill: var(--surface-2); }
.gantt .balken { fill: var(--balken); } .gantt .balken.kritisch { fill: var(--kritisch); } .gantt .anteil { fill: var(--anteil); }
.gantt .pfeil { stroke: var(--label); stroke-width: 1.25; fill: none; } .gantt .spitze { fill: var(--label); }
.gantt .heute { stroke: var(--negative); stroke-width: 1.5; stroke-dasharray: 4 3; }
.legende { display: flex; flex-wrap: wrap; gap: 4px 16px; padding-top: 8px; color: var(--label); font-size: 12px; }
.legende i { display: inline-block; width: 14px; height: 8px; border-radius: 2px; margin-right: 6px; background: var(--balken); } .legende i.k { background: var(--kritisch); }
.frage { border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin-top: 10px; }

.frage .emp { color: var(--positive); font-size: 12px; font-weight: 700; }
.meldung { border-radius: 8px; padding: 8px 12px; border: 1px solid var(--info); background: var(--info-bg); margin-top: 16px; }
.meldung.fehler { border-color: var(--negative); background: var(--negative-bg); }

.blatt .band { background: #e2701f; color: #fff; padding: 22px 28px 16px; } .blatt .band h2 { margin: 0; font-size: 26px; font-weight: 400; letter-spacing: 0.02em; } .blatt .band div { margin-top: 2px; }
.blatt .innen { padding: 16px 28px 26px; }
.blatt .kz { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px 16px; margin-bottom: 12px; } .blatt .kz span { display: block; font-size: 10px; color: #6b6b6b; letter-spacing: 0.04em; } .blatt .kz b { font-size: 13px; }
.blatt h4 { color: #b9561a; margin: 16px 0 6px; font-size: 13px; }
.blatt table { font-size: 12px; } .blatt th { background: transparent; color: #6b6b6b; font-size: 10.5px; } .blatt th, .blatt td { border-color: #e3e3e3; padding: 4px 8px; }
.blatt .rahmen { border: 1px solid #c8c8c8; border-radius: 8px; padding: 4px 6px; overflow-x: auto; }
.blatt .klein { color: #6b6b6b; font-size: 11px; margin-top: 6px; }
.blatt .unterschrift { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin-top: 44px; } .blatt .unterschrift div { border-top: 1px solid #6b6b6b; padding-top: 4px; color: #6b6b6b; font-size: 11px; }
.blatt .gb { height: 9px; border-radius: 2px; background: #c8c8c8; position: relative; } .blatt .gb.k { background: #e2701f; }

<div class="shell"><div class="wrap"><b>TC Oberthal · Vereinsportal</b><span>Finanzen → Projekte</span><span class="status warn">Vorschlag und Mockup – noch nicht freigegeben</span></div></div>
<div class="wrap">

    <div class="reihe"><span class="status neutral">Idee / Entwurf</span><button class="knopf" data-hinweis="Im Portal öffnet sich hier derselbe Dialog wie im Haushaltsplan: Stammdaten, Kosten, Finanzierung, Beantragen.">Stammdaten, Kosten, Antrag stellen</button><button class="knopf haupt" data-tab="antrag">Projektantrag (PDF)</button></div>

<script>
// ------------------------------------------------------------------ Beispieldaten (frei erfunden, Termine relativ zu heute)
const TAG = 86400000;
const heute = Math.floor(Date.now() / TAG);
const start = heute - 9;
const iso = (n) => new Date(n * TAG).toISOString().slice(0, 10);
const dat = (n) => { const s = iso(n); return `${s.slice(8, 10)}.${s.slice(5, 7)}.${s.slice(0, 4)}`; };
const eur = (v) => `${Math.round(v).toLocaleString('de-DE')} €`;
const zahl = (v) => v.toLocaleString('de-DE', { maximumFractionDigits: 2 });
const lies = (s) => { const t = String(s).trim().replace(/\s|€/g, ''); if (!t) return 0; const n = Number(t.includes(',') ? t.replace(/\./g, '').replace(',', '.') : t); return Number.isFinite(n) && n >= 0 ? n : 0; };
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let nr = 0;
const d = {
  satz: 45,
  kosten: [
    { art: 'Kosten', text: 'Belag und Linien (Material)', betrag: 4000 }, { art: 'Kosten', text: 'Containerdienst', betrag: 600 },
    { art: 'Zuschuss', text: 'Landessportverband', betrag: 1500 }, { art: 'Eigenmittel', text: 'Rücklage Platzsanierung', betrag: 2500 },
  ],
  v: [
    { id: ++nr, name: 'Angebote einholen', dauer: 14, vor: '', fertig: 100, wer: 'Sportwart' },
    { id: ++nr, name: 'Alten Belag abtragen', dauer: 3, vor: '1+7', fertig: 40, wer: 'Platzwart' },
    { id: ++nr, name: 'Neuen Belag einbauen', dauer: 5, vor: '2', fertig: 0, wer: 'Platzwart' },
    { id: ++nr, name: 'Linien setzen', dauer: 1, vor: '3', fertig: 0, wer: '' },
    { id: ++nr, name: 'Zaun streichen', dauer: 4, vor: '1', fertig: 0, wer: '' },
    { id: ++nr, name: 'Abnahme durch den Vorstand', dauer: 0, vor: '4; 5', fertig: 0, wer: 'Vorsitzender' },
  ],
  a: [
    { wer: 'Bauer, Anna', mitglied: true, was: 'Belag abtragen', vorgang: 2, personen: 1, stunden: 8, satz: '' },
    { wer: 'Helfer', mitglied: false, was: 'Schubkarren fahren', vorgang: 2, personen: 4, stunden: 6, satz: '' },
    { wer: 'Schmitt, Ben', mitglied: true, was: 'Linien einmessen', vorgang: 4, personen: 1, stunden: 4.5, satz: '60' },
    { wer: 'Helfer', mitglied: false, was: 'Zaun streichen', vorgang: 5, personen: 3, stunden: 5, satz: '' },
  ],
  m: [
    { was: 'Ziegelmehl', lieferant: 'Baustoff Müller', vorgang: 3, menge: 2.5, einheit: 't', preis: 180, da: false },
    { was: 'Linienband', lieferant: 'Tennisbau Saar', vorgang: 4, menge: 2, einheit: 'Satz', preis: 625, da: true },
    { was: 'Zaunfarbe', lieferant: '', vorgang: 5, menge: 6, einheit: 'Eimer', preis: 48, da: false },
  ],
};
const MITGLIEDER = ['Bauer, Anna', 'Schmitt, Ben', 'Weber, Clara', 'Klein, Petra', 'Hoffmann, Jan'];
let tab = 'vorschlag', fehler = '';

// ------------------------------------------------------------------ Terminrechnung (wie im Vorschlag: Ende → Anfang, Kalendertage)
function terminieren() {
  fehler = '';
  const n = d.v.length, vor = d.v.map((v, i) => String(v.vor).split(/[;,\s]+/).filter(Boolean).map((t) => {
    const m = /^(\d+)([+-]\d+)?$/.exec(t); const j = m ? Number(m[1]) - 1 : -1;
    if (!m || j < 0 || j >= n || j === i) { fehler = `Vorgang ${i + 1}: Vorgänger „${t}“ nicht erkannt – erlaubt sind Zeilennummern, z. B. „1; 2+3“.`; return null; }
    return { j, abstand: Number(m[2] || 0) };
  }).filter(Boolean));
  const offen = vor.map((x) => new Set(x.map((p) => p.j)).size), reihe = [], bereit = [];
  offen.forEach((o, i) => { if (!o) bereit.push(i); });
  while (bereit.length) { const k = bereit.shift(); reihe.push(k); vor.forEach((x, i) => { if (x.some((p) => p.j === k) && !reihe.includes(i) && !bereit.includes(i)) { offen[i]--; if (!offen[i]) bereit.push(i); } }); }
  if (reihe.length !== n) { fehler = 'Die Vorgänge bedingen sich im Kreis – bitte eine Abhängigkeit entfernen.'; return null; }
  const fb = [], fe = [], se = [];
  for (const k of reihe) { let b = vor[k].length ? -Infinity : start; for (const p of vor[k]) b = Math.max(b, fe[p.j] + p.abstand); fb[k] = b; fe[k] = b + Math.max(0, d.v[k].dauer); }
  const schluss = Math.max(start, ...fe);
  for (const k of [...reihe].reverse()) { let e = schluss; vor.forEach((x, i) => { for (const p of x) if (p.j === k) e = Math.min(e, se[i] - Math.max(0, d.v[i].dauer) - p.abstand); }); se[k] = e; }
  const tage = d.v.reduce((s, v) => s + Math.max(1, v.dauer), 0);
  return { z: d.v.map((v, i) => ({ beginn: fb[i], ende: v.dauer ? fe[i] - 1 : fb[i], puffer: se[i] - fe[i], kritisch: se[i] - fe[i] <= 0, vor: vor[i] })), beginn: start, ende: schluss - 1, tage: schluss - start,
    fertig: Math.round(d.v.reduce((s, v) => s + Math.max(1, v.dauer) * v.fertig, 0) / tage) };
}
let plan = terminieren();
const summen = () => {
  const stunden = d.a.reduce((s, a) => s + a.personen * a.stunden, 0);
  const wert = d.a.reduce((s, a) => s + a.personen * a.stunden * (a.satz === '' ? d.satz : lies(a.satz)), 0);
  const personen = new Set(d.a.filter((a) => a.mitglied).map((a) => a.wer)).size + d.a.filter((a) => !a.mitglied).reduce((s, a) => s + a.personen, 0);
  const material = d.m.reduce((s, m) => s + m.menge * m.preis, 0), da = d.m.filter((m) => m.da).reduce((s, m) => s + m.menge * m.preis, 0);
  const kosten = d.kosten.filter((k) => k.art === 'Kosten').reduce((s, k) => s + k.betrag, 0), fin = d.kosten.filter((k) => k.art !== 'Kosten').reduce((s, k) => s + k.betrag, 0);
  return { stunden, wert, personen, material, da, kosten, fin, luecke: Math.max(0, kosten - fin) };
};

// ------------------------------------------------------------------ Gantt
function gantt() {
  if (!plan) return '';
  const NAME = 220, KOPF = 34, ZEILE = 28, t0 = plan.beginn - 3, t1 = plan.ende + 8, tage = t1 - t0, px = Math.min(26, Math.max(2.5, 900 / tage));
  const W = NAME + tage * px + 16, H = KOPF + d.v.length * ZEILE + 8, x = (t) => NAME + (t - t0) * px, y = (i) => KOPF + i * ZEILE + ZEILE / 2;
  let s = `<rect class="kopfband" x="0" y="0" width="${W}" height="${KOPF}"/>`;
  const dt = new Date(t0 * TAG); dt.setUTCDate(1);
  for (; dt.getTime() / TAG < t1; dt.setUTCMonth(dt.getUTCMonth() + 1)) { const t = Math.round(dt.getTime() / TAG); if (t >= t0) s += `<line class="raster" x1="${x(t)}" x2="${x(t)}" y1="0" y2="${H}"/><text class="leise" x="${x(t) + 5}" y="21">${['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'][dt.getUTCMonth()]} ${dt.getUTCFullYear()}</text>`; }
  if (px >= 6) for (let t = t0; t < t1; t++) if (new Date(t * TAG).getUTCDay() === 1) s += `<line class="raster" stroke-opacity="0.45" x1="${x(t)}" x2="${x(t)}" y1="${KOPF}" y2="${H}"/>`;
  s += `<line class="raster" x1="${NAME}" x2="${NAME}" y1="0" y2="${H}"/><line class="raster" x1="0" x2="${W}" y1="${KOPF}" y2="${KOPF}"/><text class="leise" x="10" y="21">Vorgang</text>`;
  s += `<line class="heute" x1="${x(heute)}" x2="${x(heute)}" y1="${KOPF - 6}" y2="${H}"/>`;
  plan.z.forEach((z, i) => z.vor.forEach((p) => {
    const q = plan.z[p.j], x1 = x(q.ende + (d.v[p.j].dauer ? 1 : 0)), y1 = y(p.j), x2 = x(z.beginn), y2 = y(i);
    const weg = x2 - 6 >= x1 + 5 ? `M${x1},${y1} H${x1 + 5} V${y2} H${x2 - 1}` : `M${x1},${y1} H${x1 + 5} V${y2 - ZEILE / 2 + (y2 > y1 ? 0 : ZEILE)} H${x2 - 8} V${y2} H${x2 - 1}`;
    s += `<path class="pfeil" d="${weg}"/><path class="spitze" d="M${x2},${y2} l-6,-3.5 v7 z"/>`;
  }));
  plan.z.forEach((z, i) => {
    const v = d.v[i], xa = x(z.beginn), b = Math.max(3, v.dauer * px), k = z.kritisch ? ' kritisch' : '';
    const tip = `${i + 1}. ${v.name}: ${dat(z.beginn)}${v.dauer ? ` – ${dat(z.ende)} (${v.dauer} Tage)` : ' (Meilenstein)'}, ${v.fertig} % erledigt${z.kritisch ? ', kritischer Weg' : `, ${z.puffer} Tage Puffer`}`;
    s += `<text x="10" y="${y(i) + 4}"><tspan class="leise">${i + 1}. </tspan>${esc(v.name.length > 28 ? v.name.slice(0, 27) + '…' : v.name)}</text>`;
    s += v.dauer ? `<rect class="balken${k}" x="${xa}" y="${y(i) - 8}" width="${b}" height="16" rx="3"><title>${esc(tip)}</title></rect>${v.fertig ? `<rect class="anteil" x="${xa}" y="${y(i) - 8}" width="${b * v.fertig / 100}" height="16" rx="3"/>` : ''}`
      : `<path class="balken${k}" d="M${xa},${y(i) - 8} l8,8 l-8,8 l-8,-8 z"><title>${esc(tip)}</title></path>`;
  });
  return `<div class="gantt"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gantt-Diagramm">${s}</svg></div>
    <div class="legende"><span><i></i>Vorgang</span><span><i class="k"></i>kritischer Weg (ohne Puffer)</span><span>dunkel: erledigter Anteil</span><span>◆ Meilenstein</span><span>→ beginnt nach dem Vorgänger</span><span>gestrichelt: heute</span></div>`;
}

// ------------------------------------------------------------------ Reiter
const FRAGEN = [
  ['tage', 'Wie wird die Dauer gerechnet?', ['Kalendertage – einfach, Wochenenden zählen mit (Arbeitseinsätze sind meist samstags)', 'Arbeitstage Montag bis Freitag', 'Wählbar je Vorgang'], 0],
  ['material', 'Wie hängt das Material mit der Kostenplanung zusammen?', ['Getrennt – das Material steht als Vergleich neben den Kosten', 'Knopf „als Kostenposition übernehmen“ (Summe des Materials wird eine Kostenposition)', 'Material ist die Kostenplanung: jede Zeile ist automatisch eine Kostenposition'], 1],
  ['eigen', 'Wie erscheint die Eigenleistung im Antrag?', ['Als eigener Abschnitt mit Wert zum externen Satz – nicht in Kosten und Finanzierung', 'Zusätzlich als Finanzierungsart „Eigenleistung“ (Kosten = Fremdvergabe, davon durch Mitglieder erbracht)'], 0],
  ['satz', 'Woher kommt der externe Verrechnungssatz?', ['Eine Vorgabe je Projekt, je Zeile überschreibbar', 'Sätze je Tätigkeit in den Einstellungen (z. B. Helfer 25 €, Fachkraft 60 €)'], 0],

function zeichne(fokus) {

  document.getElementById('tabs').innerHTML = TABS.map(([k, t]) => `<button role="tab" aria-selected="${tab === k}" data-tab="${k}">${t}</button>`).join('');
  document.getElementById('seite').innerHTML = (fehler ? `<div class="meldung fehler">${esc(fehler)}</div>` : tab === 'vorschlag' ? '' : '<div class="meldung"><b>Mockup mit erfundenen Beispieldaten.</b> Felder ändern, Zeilen anlegen und entfernen – gespeichert wird nichts.</div>')
    + ({ vorschlag, uebersicht, kosten, termine, ressourcen, antrag }[tab])();
  if (fokus) { const el = document.getElementById(fokus); if (el) el.focus(); }
}
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 4200); }

document.addEventListener('change', (e) => {
  const t = e.target, f = t.dataset.f;
  if (t.name && t.name.startsWith('f_')) { wahl[t.name.slice(2)] = Number(t.value); return; }
  if (t.id === 'satz') d.satz = lies(t.value);
  else if (t.dataset.v != null) { const v = d.v[t.dataset.v]; if (f === 'dauer') v.dauer = Math.min(3660, Math.round(lies(t.value))); else if (f === 'fertig') v.fertig = Math.min(100, Math.round(lies(t.value))); else v[f] = t.value.trim() || (f === 'name' ? v.name : ''); }

  else if (t.dataset.m != null) { const m = d.m[t.dataset.m]; if (f === 'da') m.da = t.checked; else if (f === 'menge' || f === 'preis') m[f] = lies(t.value); else if (f === 'vorgang') m.vorgang = Number(t.value); else m[f] = t.value.trim(); }

  zeichne();
});

  else if (x.neu === 'am') d.a.push({ wer: MITGLIEDER[2], mitglied: true, was: '', vorgang: 0, personen: 1, stunden: 4, satz: '' });
  else if (x.neu === 'ah') d.a.push({ wer: 'Helfer', mitglied: false, was: '', vorgang: 0, personen: 2, stunden: 4, satz: '' });
  else if (x.neu === 'm') d.m.push({ was: 'Neues Material', lieferant: '', vorgang: 0, menge: 1, einheit: 'Stück', preis: 0, da: false });
  else if (x.weg === 'a') d.a.splice(Number(x.i), 1);
  else if (x.weg === 'm') d.m.splice(Number(x.i), 1);
  else if (x.weg === 'v') {
    const i = Number(x.i);
    d.v.splice(i, 1);
    // Zeilennummern in den Vorgänger-Angaben und an den Ressourcen mitziehen
    for (const v of d.v) v.vor = String(v.vor).split(/[;,\s]+/).filter(Boolean).flatMap((s) => { const m = /^(\d+)([+-]\d+)?$/.exec(s); if (!m) return [s]; const n = Number(m[1]); return n === i + 1 ? [] : [`${n > i + 1 ? n - 1 : n}${m[2] || ''}`]; }).join('; ');
    for (const r of [...d.a, ...d.m]) r.vorgang = r.vorgang === i + 1 ? 0 : r.vorgang > i + 1 ? r.vorgang - 1 : r.vorgang;
  }
  else return;
  zeichne();
});
zeichne();
